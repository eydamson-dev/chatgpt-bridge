[project]
name = "chatgpt-bridge"
version = "0.2.0"
description = "Read and search your ChatGPT web conversations via a logged-in Chromium browser over CDP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "playwright>=1.45",
    "platformdirs>=4.2",
]

[project.scripts]
chatgpt-bridge = "chatgpt_bridge.cli:main"
chatgpt-bridge-mcp = "chatgpt_bridge.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses a real CDP browser; skipped unless the endpoint responds",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/chatgpt_bridge"]
