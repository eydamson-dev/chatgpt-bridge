name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Build
        run: uv build
      - name: Smoke test the wheel
        run: |
          uv venv /tmp/wheel-test
          uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
          CHATGPT_BRIDGE_DATA_DIR=/tmp/wheel-test/data \
            /tmp/wheel-test/bin/chatgpt-bridge version
          CHATGPT_BRIDGE_DATA_DIR=/tmp/wheel-test/data \
            /tmp/wheel-test/bin/chatgpt-bridge status
